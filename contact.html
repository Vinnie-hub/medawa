<div class="container page"><div class="two-col" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
<div class="contact-list">
<div><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><p style="margin:0"><b>Visit</b><span>Westlands, Nairobi, Kenya</span></p></div>
<div><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><p style="margin:0"><b>Call</b><span>+254 700 000 000</span></p></div>

<div class="field"><label class="f" for="s">Subject</label><input id="s"></div>
<div class="field"><label class="f" for="m">Message</label><textarea id="m" required></textarea></div>
<button class="btn btn-block">Send message</button></form></div></div></main>
